# Server
server.port=${PORT:8080}
spring.application.name=repodoctor

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/repodoctor;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# Startup Performance Optimizations
spring.main.lazy-initialization=true
spring.jpa.defer-datasource-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy

# Performance tuning
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# File Upload
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Async
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8

# RepoDoctor Config
repodoctor.artifacts-path=${ARTIFACTS_PATH:/tmp/repodoctor/artifacts}
repodoctor.workspaces-path=${WORKSPACES_PATH:/tmp/repodoctor/workspaces}
repodoctor.runner-image=repodoctor-runner:latest
repodoctor.runner-mode=${RUNNER_MODE:docker}
repodoctor.max-attempts-limit=2
repodoctor.max-zip-size-mb=25
repodoctor.max-file-count=250
repodoctor.container-timeout-seconds=300
repodoctor.container-memory-mb=2048
repodoctor.container-cpus=1.0

# Gemini
repodoctor.gemini.api-key=${GEMINI_API_KEY:}
repodoctor.gemini.pro-model=gemini-3-flash-preview
repodoctor.gemini.flash-model=gemini-3-flash-preview

# CORS - comma-separated list of allowed origins
# For local development: http://localhost:3000,http://localhost:8080
# For production: set via CORS_ALLOWED_ORIGINS env variable to your frontend URL
repodoctor.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# GitHub Integration (for PR creation)
# To enable:
# 1. Create a GitHub OAuth App at https://github.com/settings/developers
# 2. Set callback URL to: {your-backend-url}/api/github/callback
# 3. Configure the client ID and secret below or via environment variables
repodoctor.github.pr-creation-enabled=${GITHUB_PR_CREATION_ENABLED:true}
repodoctor.github.client-id=${GITHUB_CLIENT_ID:}
repodoctor.github.client-secret=${GITHUB_CLIENT_SECRET:}
repodoctor.github.callback-url=${GITHUB_CALLBACK_URL:http://localhost:8080/api/github/callback}
repodoctor.github.frontend-url=${GITHUB_FRONTEND_URL:http://localhost:3000}
repodoctor.github.scopes=repo